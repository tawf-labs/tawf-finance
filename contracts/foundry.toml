[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"
fuzz = { runs = 256 }

# Arbitrum Sepolia
[rpc_endpoints]
arbitrum_sepolia = "https://sepolia-rollup.arbitrum.io/rpc"

[etherscan]
arbitrum_sepolia = { key = "${ARBISCAN_API_KEY}", url = "https://api-sepolia.arbiscan.io/api" }

# Synthetic evaluation profile (book chapter). Usage: FOUNDRY_PROFILE=eval forge test
[profile.eval]
test = "test/eval"
script = "script/eval"
isolate = true
gas_limit = 9223372036854775807
memory_limit = 2147483648
fs_permissions = [{ access = "read-write", path = "../eval" }]

# Local-Anvil prototype profile (disbursement verification layer, future work).
# Scopes tests + scripts to the prototype namespace so the prototype builds and
# tests in isolation; it does not alter the default or eval profiles, the
# production contracts, or their ABIs. Usage: FOUNDRY_PROFILE=prototype forge test
[profile.prototype]
test = "test/prototype"
script = "script/prototype"
